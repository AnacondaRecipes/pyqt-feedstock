{% set name = "pyqt" %}
{% set version = "6.12.0" %}
# The optional WebEngine output targets Qt 6.12, but qtwebengine 6.12.0 is not
# on pkgs/main yet. Keep this output skipped until that dependency is available.
{% set pyqt_webengine_version = "6.140.0" %}
{% set pyqt_sip_version = "13.13.0" %}
{% set pyqt_sip_pkg_name = "PyQt" + version[0] + "-sip" %}

# The Qt package versions should match: sip detects the version in qt-main and
# assumes the remaining Qt packages, including qtwebengine, use the same version.
{% set qt_version = "6.12.0" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/P/PyQt{{ version[0] }}/pyqt{{ version[0] }}-{{ version }}.tar.gz
    sha256: d3e021b716bae880224422f9d1b894d2d53de7e60e60dbc43f860723f9cc300b
    folder: pyqt

  - url: https://pypi.org/packages/source/P/{{ pyqt_sip_pkg_name }}/{{ pyqt_sip_pkg_name.replace("-", "_") | lower }}-{{ pyqt_sip_version }}.tar.gz
    sha256: 2cd55f575cde208c398d6cfdecc5a13394ed2afb54226210c50e3a6df7c3a997
    folder: pyqt_sip

build:
  number: 0
  skip: true  # [py<310]

outputs:
  - name: {{ pyqt_sip_pkg_name | lower }}
    version: {{ pyqt_sip_version }}
    script: build-pyqt-sip.sh  # [not win]
    script: bld-pyqt-sip.bat   # [win]
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
      host:
        - python
        - setuptools >=75.8.1
        - wheel
        - pip
      run:
        - python
    test:
      imports:
        - PyQt6.sip
      requires:
        - pip
      commands:
        - pip check

  - name: {{ name }}
    version: {{ version }}
    script: build-pyqt.sh  # [not win]
    script: bld-pyqt.bat   # [win]
    build:
      entry_points:
        - pylupdate6 = PyQt6.lupdate.pylupdate:main
        - pyuic6 = PyQt6.uic.pyuic:main
      run_exports:
        - {{ pin_subpackage('pyqt', max_pin='x.x') }}
      missing_dso_whitelist:
        - $RPATH/libm.so.6
        - $RPATH/libpthread.so.0
        - $RPATH/libc.so.6
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - make                            # [not win]
        - jom                             # [win]
        - pkg-config
      host:
        - python
        # Upstream asks for pyqt-builder >=1.20; pkgs/main currently caps at 1.19.1,
        # which builds PyQt6 6.12.0 successfully.
        - pyqt-builder >=1.19,<2
        - sip >=6.17,<7
        - qtbase-devel {{ qt_version }}
        - qtdeclarative {{ qt_version }}
        - qtsvg {{ qt_version }}
        - qttools {{ qt_version }}
        - qtwayland  {{ qt_version }}        # [linux]
        - qtwebchannel {{ qt_version }}
        - qtwebsockets {{ qt_version }}
        # OpenGL and X11 dependencies
        - libgl-devel {{ libgl }}            # [linux]
        - libvulkan-headers {{ vulkan_loader }}  # [not osx]
        - libvulkan-loader {{ vulkan_loader }}   # [not osx]
      run:
        - python
        - {{ pin_subpackage(pyqt_sip_pkg_name | lower, exact=True) }}
        # Qt6Gui links libxkbcommon; qtbase-devel's run_exports does not pull it in.
        - libxkbcommon  # [linux]
    test:
      files:
        - pyqt_test.py
      imports:
        - PyQt6
        - PyQt6.QtCore
        - PyQt6.QtDBus
        - PyQt6.QtDesigner
        - PyQt6.QtGui
        - PyQt6.QtHelp
        - PyQt6.QtNetwork
        - PyQt6.QtOpenGL
        - PyQt6.QtOpenGLWidgets
        - PyQt6.QtPrintSupport
        - PyQt6.QtQml
        - PyQt6.QtQuick
        - PyQt6.QtQuickWidgets
        - PyQt6.QtSql
        - PyQt6.QtSvg
        - PyQt6.QtSvgWidgets
        - PyQt6.QtTest
        - PyQt6.QtWebChannel
        - PyQt6.QtWebSockets
        - PyQt6.QtWidgets
        - PyQt6.QtXml
      requires:
        - pip
      commands:
        - pip check

  - name: {{ name }}webengine
    version: {{ pyqt_webengine_version }}
    script: build-pyqtwebengine.sh  # [not win]
    script: bld-pyqtwebengine.bat   # [win]
    build:
      # qtwebengine 6.12.0 is not on pkgs/main yet, so this output cannot build
      # against the Qt 6.12 stack. Restore it when that dependency is available.
      skip: true
      run_exports:
        - {{ pin_subpackage('pyqtwebengine', max_pin='x.x') }}
      missing_dso_whitelist:
        - $RPATH/libm.so.6
        - $RPATH/libpthread.so.0
        - $RPATH/libc.so.6
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - make  # [not win]
        - jom   # [win]
        - pkg-config
      host:
        - python
        - pyqt-builder >=1.19,<2
        - sip >=6.17,<7
        - {{ pin_subpackage('pyqt', exact=True) }}
        - qtbase-devel {{ qt_version }}
        - qtdeclarative {{ qt_version }}
        - qtwebchannel {{ qt_version }}
        - qtwebengine {{ qt_version }}
        # OpenGL and X11 dependencies
        - libgl-devel {{ libgl }}            # [linux]
        - libvulkan-headers {{ vulkan_loader }}  # [not osx]
        - libvulkan-loader {{ vulkan_loader }}   # [not osx]
      run:
        - python
        - {{ pin_subpackage('pyqt', max_pin='x.x') }}
        # Qt6Gui links libxkbcommon; qtbase-devel's run_exports does not pull it in.
        - libxkbcommon  # [linux]
    test:
      imports:
        - PyQt6.QtWebEngineCore
        - PyQt6.QtWebEngineQuick
        - PyQt6.QtWebEngineWidgets
      requires:
        - pip
      commands:
        - pip check

about:
  home: https://www.riverbankcomputing.com/software/pyqt
  license: GPL-3.0-only
  license_family: GPL
  license_file: pyqt/LICENSE
  summary: Python bindings for the Qt cross platform application toolkit
  description: |
    PyQt{{ version[0] }} is a comprehensive set of Python bindings for Qt v{{ version[0] }}.
    It is implemented as more than 35 extension modules and enables Python
    to be used as an alternative application development language to C++ on
    all supported platforms including iOS and Android.
  doc_url: https://www.riverbankcomputing.com/static/Docs/PyQt{{ version[0] }}/
  dev_url: https://www.riverbankcomputing.com/mailman/listinfo/pyqt/

extra:
  skip-lints:
    - missing_python_build_tool
    - host_section_needs_exact_pinnings
  recipe-maintainers:
    - andfoy
    - ccordoba12
    - katietz
    - mingwandroid
    - gillins
    - msarahan
    - ocefpaf
    - jschueller
  feedstock-name: pyqt
